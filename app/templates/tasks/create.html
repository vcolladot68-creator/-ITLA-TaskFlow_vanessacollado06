
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva tarea | ITLA TaskFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('main.dashboard') }}">
            ITLA <span class="text-info">TaskFlow</span>
        </a>
    </div>
</nav>

<main class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <h2 class="fw-bold mb-2">Crear nueva tarea</h2>
                    <p class="text-muted mb-4">Completa los datos de tu actividad.</p>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endwith %}

                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label class="form-label" for="title">Título *</label>
                            <input type="text" class="form-control" id="title"
                                   name="title" maxlength="150" required
                                   value="{{ request.form.get('title', '') }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="description">Descripción</label>
                            <textarea class="form-control" id="description"
                                      name="description" rows="3">{{ request.form.get('description', '') }}</textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="status">Estado</label>
                                <select class="form-select" id="status" name="status">
                                    <option value="pending">Pendiente</option>
                                    <option value="in_progress">En progreso</option>
                                    <option value="completed">Completada</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="priority">Prioridad</label>
                                <select class="form-select" id="priority" name="priority">
                                    <option value="low">Baja</option>
                                    <option value="medium" selected>Media</option>
                                    <option value="high">Alta</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="due_date">Fecha límite</label>
                            <input type="date" class="form-control" id="due_date"
                                   name="due_date">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="project_id">Proyecto</label>
                            <select class="form-select" id="project_id" name="project_id">
                                <option value="">Sin proyecto</option>
                                {% for project in projects %}
                                    <option value="{{ project.id }}">{{ project.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="category_id">Categoría</label>
                            <select class="form-select" id="category_id" name="category_id">
                                <option value="">Sin categoría</option>
                                {% for category in categories %}
                                    <option value="{{ category.id }}">{{ category.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                Guardar tarea
                            </button>

                            <a href="{{ url_for('tasks.index') }}"
                               class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</main>

</body>
</html>
