
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | ITLA TaskFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">

    <main class="auth-container">
        <div class="auth-card">
            <div class="text-center mb-4">
                <h1>ITLA <span>TaskFlow</span></h1>
                <p>Crea tu cuenta y organiza tus proyectos.</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Nombre de usuario</label>
                    <input type="text" class="form-control" id="username"
                           name="username" value="{{ request.form.get('username', '') }}"
                           required maxlength="80">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="email"
                           name="email" value="{{ request.form.get('email', '') }}"
                           required maxlength="120">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password"
                           name="password" minlength="8" required>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label">Confirmar contraseña</label>
                    <input type="password" class="form-control" id="confirm_password"
                           name="confirm_password" minlength="8" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Crear cuenta
                </button>
            </form>

            <p class="text-center mt-4 mb-0">
                ¿Ya tienes una cuenta?
                <a href="{{ url_for('auth.login') }}">Inicia sesión</a>
            </p>
        </div>
    </main>

</body>
</html>
